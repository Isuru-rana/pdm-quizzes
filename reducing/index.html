<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz: Reducing as a Design Challenge</title>
<meta name="description" content="Unit 3 Product Design and Manufacture in Engineering: quick quiz on reducing as a design challenge.">
<style>
  :root {
    --teal: #1f6f78;
    --teal-dark: #164f56;
    --orange: #e06c2b;
    --bg: #f4f1ec;
    --card: #ffffff;
    --ink: #1f2328;
    --muted: #5d646b;
    --line: #dcd6cc;
    --good: #2e7d32;
    --good-bg: #e7f4e8;
    --bad: #c62828;
    --bad-bg: #fbe9e9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.45;
    min-height: 100vh;
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 20px 16px 40px; }
  header { margin-bottom: 18px; }
  .unit { font-size: 13px; color: var(--muted); letter-spacing: .02em; }
  h1 { font-size: 24px; margin: 4px 0 0; color: var(--teal-dark); }
  h1 span { color: var(--orange); }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .progress i { display: block; height: 100%; width: 0; background: var(--orange); transition: width .3s; }
  .meta { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-bottom: 10px; }
  .q { font-size: 19px; font-weight: 650; margin: 0 0 16px; outline: none; }
  .opts { display: grid; gap: 10px; }
  .opt {
    display: flex; gap: 12px; align-items: flex-start;
    width: 100%; text-align: left;
    font: inherit; font-size: 16px; color: var(--ink);
    background: #fff; border: 2px solid var(--line); border-radius: 10px;
    padding: 12px 14px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt b {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center; font-size: 14px;
    background: var(--bg); color: var(--teal-dark);
  }
  .opt:hover:not(:disabled) { border-color: var(--teal); }
  .opt:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  .opt:disabled { cursor: default; }
  .opt.right { border-color: var(--good); background: var(--good-bg); }
  .opt.right b { background: var(--good); color: #fff; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .opt.wrong b { background: var(--bad); color: #fff; }
  .feedback { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 15px; display: none; }
  .feedback.show { display: block; }
  .feedback.good { background: var(--good-bg); color: #1b4d1e; }
  .feedback.bad { background: var(--bad-bg); color: #6d1414; }
  .feedback strong { display: block; margin-bottom: 2px; }
  .btn {
    display: inline-block; margin-top: 18px; width: 100%;
    font: inherit; font-size: 17px; font-weight: 650;
    color: #fff; background: var(--teal); border: 0; border-radius: 10px;
    padding: 14px; cursor: pointer;
  }
  .btn:hover { background: var(--teal-dark); }
  .btn:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--teal-dark); border: 2px solid var(--teal); }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  input[type=text] {
    width: 100%; font: inherit; font-size: 17px; padding: 12px;
    border: 2px solid var(--line); border-radius: 10px; background: #fff;
  }
  input[type=text]:focus { outline: none; border-color: var(--teal); }
  .intro p { margin: 0 0 8px; }
  .score { text-align: center; }
  .score .big { font-size: 56px; font-weight: 800; color: var(--teal-dark); line-height: 1; margin: 8px 0; }
  .score .who { font-size: 18px; font-weight: 650; }
  .score .time { font-size: 13px; color: var(--muted); }
  .score .msg { font-size: 17px; margin: 10px 0 4px; }
  .review { margin-top: 18px; display: grid; gap: 8px; text-align: left; }
  .review div { font-size: 14px; padding: 10px 12px; border-radius: 8px; background: var(--bg); }
  .review .ok { border-left: 4px solid var(--good); }
  .review .no { border-left: 4px solid var(--bad); }
  .hidden { display: none; }
  footer { margin-top: 18px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="unit">Unit 3: Product Design and Manufacture in Engineering</div>
    <h1>Quick Quiz: <span>Reducing</span></h1>
  </header>

  <section id="start" class="card intro">
    <p>10 questions on <b>reducing as a design challenge</b>.</p>
    <p>Tap an answer. You will see straight away if it is right, with a short reason.</p>
    <label for="name">Your name</label>
    <input id="name" type="text" autocomplete="name" placeholder="e.g. Nimal Perera" maxlength="40">
    <button class="btn" id="go">Start quiz</button>
  </section>

  <section id="quiz" class="card hidden" aria-live="polite">
    <div class="progress"><i id="bar"></i></div>
    <div class="meta"><span id="count"></span><span id="pts"></span></div>
    <p class="q" id="question" tabindex="-1"></p>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="fb"></div>
    <button class="btn hidden" id="next">Next question</button>
  </section>

  <section id="done" class="card score hidden">
    <div class="who" id="who"></div>
    <div class="big" id="final"></div>
    <div class="msg" id="msg"></div>
    <div class="time" id="stamp"></div>
    <div class="review" id="review"></div>
    <button class="btn ghost" id="again">Try again</button>
  </section>

  <footer>Show your score screen to your lecturer if asked.</footer>
</div>

<script>
const QUESTIONS = [
  { q: "In engineering, \"reducing\" means:",
    o: ["Making products smaller only", "Using less material, energy and time while keeping quality", "Cutting the number of staff", "Lowering the selling price"],
    a: 1, why: "Reducing means using fewer resources while keeping or improving quality and performance." },
  { q: "Which method reduces the energy used in the DESIGN process?",
    o: ["Building a bigger factory", "Making more physical prototypes", "Computer simulation and 3D CAD", "Longer design meetings"],
    a: 2, why: "Simulation and CAD replace many physical prototypes, saving time, material and energy." },
  { q: "The Boeing 777 was the first airliner to be:",
    o: ["Made fully from carbon fibre", "Built and tested in a virtual design environment", "Powered by electric motors", "Flown without pilots"],
    a: 1, why: "Every part was designed and assembled virtually before any real manufacturing began." },
  { q: "Which is NOT a benefit of reducing the energy a product uses during operation?",
    o: ["Lower running costs", "Meeting environmental obligations", "More sales to eco-conscious buyers", "A heavier product"],
    a: 3, why: "A heavier product is not a benefit. The other three are real benefits." },
  { q: "Which feature reduces the energy an electric fan uses?",
    o: ["A brushless DC (BLDC) motor", "Heavier metal blades", "A larger front grille", "Brighter indicator lights"],
    a: 0, why: "BLDC motors use much less power than older AC fan motors for the same airflow." },
  { q: "Using less material in a steel bracket might:",
    o: ["Always make it stronger", "Reduce its strength", "Increase its mass", "Remove all costs"],
    a: 1, why: "Less material can weaken a part. This is the balancing trade-offs challenge." },
  { q: "\"Customers think the lighter version feels cheap.\" Which challenge is this?",
    o: ["Technological limitations", "Market acceptance", "Cost constraints", "Complexity in implementation"],
    a: 1, why: "Customers may see a reduction in weight or size as lower quality." },
  { q: "Cutting waste in a factory needs new machines and staff retraining. Which challenge is this?",
    o: ["Complexity in implementation", "Market acceptance", "Balancing trade-offs", "Technological limitations"],
    a: 0, why: "Changing a production process can need retooling, new machinery or retraining." },
  { q: "Why might a company reduce the mass of a product?",
    o: ["To lower material and transport costs", "To make it harder to carry", "To use more energy", "To slow down production"],
    a: 0, why: "A lighter product uses less material and costs less fuel to move." },
  { q: "Which is an example of reducing energy used during OPERATION?",
    o: ["Using CAD instead of physical prototypes", "Fitting LED bulbs instead of incandescent bulbs", "Holding design meetings online", "Testing in a virtual design environment"],
    a: 1, why: "LEDs use far less electricity while the product is in use. The others save energy during design." },
];

const $ = id => document.getElementById(id);
const LETTERS = "ABCD";
let i = 0, score = 0, name = "", answers = [];

function show(id) {
  ["start", "quiz", "done"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  window.scrollTo(0, 0);
}

function render() {
  const item = QUESTIONS[i];
  $("bar").style.width = (i / QUESTIONS.length * 100) + "%";
  $("count").textContent = `Question ${i + 1} of ${QUESTIONS.length}`;
  $("pts").textContent = `Score: ${score}`;
  $("question").textContent = item.q;
  $("fb").className = "feedback";
  $("next").classList.add("hidden");
  const box = $("opts");
  box.innerHTML = "";
  item.o.forEach((text, k) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.type = "button";
    b.innerHTML = `<b>${LETTERS[k]}</b><span></span>`;
    b.querySelector("span").textContent = text;
    b.addEventListener("click", () => choose(k));
    box.appendChild(b);
  });
  $("question").focus({ preventScroll: true });
}

function choose(k) {
  const item = QUESTIONS[i];
  const btns = [...document.querySelectorAll(".opt")];
  btns.forEach(b => b.disabled = true);
  const ok = k === item.a;
  if (ok) score++;
  answers.push({ q: item.q, ok, picked: k, right: item.a });
  btns[item.a].classList.add("right");
  if (!ok) btns[k].classList.add("wrong");
  const fb = $("fb");
  fb.className = "feedback show " + (ok ? "good" : "bad");
  fb.innerHTML = `<strong>${ok ? "Correct!" : "Not quite. The answer is " + LETTERS[item.a] + "."}</strong><span></span>`;
  fb.querySelector("span").textContent = item.why;
  $("pts").textContent = `Score: ${score}`;
  const next = $("next");
  next.textContent = i === QUESTIONS.length - 1 ? "See my score" : "Next question";
  next.classList.remove("hidden");
  next.focus({ preventScroll: true });
}

function finish() {
  $("bar").style.width = "100%";
  $("who").textContent = name || "Your score";
  $("final").textContent = `${score} / ${QUESTIONS.length}`;
  const pct = score / QUESTIONS.length;
  $("msg").textContent = pct === 1 ? "Perfect score. Excellent work!"
    : pct >= .8 ? "Great work. Check the ones you missed below."
    : pct >= .5 ? "Good effort. Review the slides on the ones you missed."
    : "Keep going. Go back over the Reducing slides and try again.";
  $("stamp").textContent = "Finished " + new Date().toLocaleString();
  const rv = $("review");
  rv.innerHTML = "";
  answers.forEach((a, n) => {
    const d = document.createElement("div");
    d.className = a.ok ? "ok" : "no";
    d.textContent = `Q${n + 1}: ${a.ok ? "correct" : "you chose " + LETTERS[a.picked] + ", answer " + LETTERS[a.right]}`;
    rv.appendChild(d);
  });
  show("done");
}

$("go").addEventListener("click", () => {
  name = $("name").value.trim();
  i = 0; score = 0; answers = [];
  show("quiz");
  render();
});
$("name").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); $("go").click(); }
});
$("next").addEventListener("click", () => {
  i++;
  if (i < QUESTIONS.length) render(); else finish();
});
$("again").addEventListener("click", () => {
  i = 0; score = 0; answers = [];
  show("quiz");
  render();
});
</script>
</body>
</html>
